# Canonical experimental parameters for Edge Quality Intelligence
# Formalizes the exact configuration used across all paper benchmarks and ablations.

experiment_metadata:
  framework_version: "1.0.0"
  governance: "Zero test leakage pre-deployment constants"
  target_fps: 30
  frame_deadline_ms: 33.333

telemetry_channels:
  channel_count: 3
  channel_specification: "Explicitly 3 physical telemetry channels evaluated (vibration RMS, motor temperature, armature current); acoustic emission channel not equipped."
  channels:
    - name: "vibration_rms"
      unit: "g"
      nominal_baseline: 0.40
      fault_multiplier: 3.5
      noise_std: 0.03
      weight: 0.45
    - name: "temperature_c"
      unit: "degC"
      nominal_target: 65.0
      ambient: 25.0
      thermal_inertia_k: 0.08
      drift_rate_c_per_hour: 2.5
      noise_std: 0.50
      weight: 0.30
    - name: "current_amps"
      unit: "A"
      nominal_running: 12.0
      fault_amps: 28.0
      noise_std: 0.40
      weight: 0.25

temporal_policy:
  sliding_window_length_N: 10
  confirmation_window_k: 4
  cooldown_steps: 15
  alpha_vision: 0.35
  alpha_sensor: 0.25
  tau_high: 0.80
  tau_medium: 0.50
  tau_sensor: 0.65
  tau_divergence: 0.45
  zscore_threshold: 0.70

spooler_durability:
  max_capacity_records: 50000
  journal_mode: "WAL"
  synchronous_mode: "NORMAL"
  delivery_guarantee: "QoS 1 at-least-once with subscriber deduplication"
  observed_loss_claim: "Zero observed missing records within evaluated 50,000-record buffer"

triage_queue_parameters:
  operator_service_capacity_per_hour: 60.0
  overload_arrival_threshold_per_hour: 60.0
  service_time_distribution: "Log-Normal(mean=1.0min, sigma=0.35)"
