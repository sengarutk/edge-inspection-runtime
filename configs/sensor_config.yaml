simulation:
  sampling_rate_hz: 30
  random_seed: 42
sensors:
  vibration:
    baseline_rms: 0.45
    noise_std: 0.05
    fault_multiplier: 3.5
  temperature:
    ambient_celsius: 25.0
    running_target_celsius: 62.0
    thermal_inertia_k: 0.02
    drift_rate_c_per_hour: 0.5
    noise_std: 0.3
  current:
    idle_amps: 2.1
    running_amps: 12.8
    fault_amps: 22.4
    noise_std: 0.4
machine_states:
  IDLE:
    load_factor: 0.1
  RUNNING:
    load_factor: 1.0
  MAINTENANCE:
    load_factor: 0.0
  FAULT:
    load_factor: 1.8
anomaly_scoring:
  zscore_threshold: 3.0
  weights:
    vibration: 0.45
    temperature: 0.25
    current: 0.30